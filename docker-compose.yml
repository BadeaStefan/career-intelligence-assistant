services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-career_intel}
    ports:
      # Bound to loopback deliberately. Publishing "5432:5432" listens on every
      # host interface, which combined with the development password would put
      # an open database on whatever network this laptop joins. The API reaches
      # Postgres over the compose network as db:5432 and does not use this
      # mapping at all -- it exists only so the local venv can run tests
      # against the same instance.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # Interpolated, not literal: `api` waits on service_healthy, so a check
      # probing a role the POSTGRES_* overrides renamed would not merely
      # report wrongly -- it would stop the API from ever starting.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-career_intel}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./api
    environment:
      # Reached over the compose network, so the loopback port mapping on db
      # is irrelevant here.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-career_intel}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      # Every Settings field must appear here. One that does not is not
      # merely undocumented -- it silently falls back to its Python default
      # in the container, whatever .env says. See
      # tests/unit/test_compose_env_contract.py.
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        # Waiting for healthy, not merely started: the container runs
        # `alembic upgrade head` on boot and would exit if Postgres were still
        # initialising.
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      # Consumed by the Vite proxy so the browser only ever talks to one
      # origin, which sidesteps CORS entirely.
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      # Source is mounted for hot reload; the anonymous volume keeps the
      # image's node_modules rather than letting the host directory shadow it.
      - ./web/src:/app/src
      - /app/node_modules

volumes:
  db_data:
